[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-edge"
version = "0.1.0"
description = "NBA Quant Edge backend — odds snapshot pipeline (Stage 1)"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8"]

[project.scripts]
nba-edge = "nba_edge.cli:main"

[tool.setuptools.packages.find]
include = ["nba_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
